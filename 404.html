<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Pharo Hotel</title>
  <meta name="robots" content="noindex">
  <!-- Self-contained on purpose: GitHub Pages serves this file for any missing
       path, so relative links to assets/ would break on nested URLs. -->
  <style>
    :root { --navy: #0f2a3d; --accent: #c9823a; --light: #ffd7a3; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: radial-gradient(circle at 70% 80%, #3a5570 0%, var(--navy) 60%);
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    svg { width: 72px; height: 72px; margin: 0 auto 24px; display: block; }
    p.code { margin: 0 0 8px; color: var(--light); letter-spacing: .2em; font-size: .8rem; font-weight: 600; }
    h1 { margin: 0 0 12px; font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(2rem, 6vw, 3rem); }
    p { margin: 0 0 28px; color: rgba(255, 255, 255, .8); line-height: 1.6; }
    a {
      display: inline-block;
      padding: .85rem 1.6rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #a86726; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M13.5 7 3 4v6zM18.5 7 29 4v6z" fill="#f2b56b" opacity=".55"/>
      <path d="M12.5 5 16 2l3.5 3z" fill="#fff"/>
      <rect x="13.5" y="5" width="5" height="4" fill="#f2b56b"/>
      <rect x="12" y="9" width="8" height="2" rx=".5" fill="#fff"/>
      <path d="M13 11h6l1.5 17h-9z" fill="#fff"/>
      <path d="M12.47 17h7.06l.26 3h-7.58z" fill="#f2b56b"/>
      <path d="M6 29h20" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <p class="code">404</p>
    <h1>Lost at sea?</h1>
    <p>The page you’re looking for isn’t here.<br>Let the lighthouse guide you back.</p>
    <a id="home" href="/">Back to Pharo Hotel</a>
  </main>
  <script>
    // Project sites live under /<repo>/ on github.io; custom domains live at /.
    if (location.hostname.endsWith('github.io')) {
      var repo = location.pathname.split('/')[1];
      if (repo) document.getElementById('home').href = '/' + repo + '/';
    }
  </script>
</body>
</html>
