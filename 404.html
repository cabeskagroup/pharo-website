<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — The Pharo</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital@1&family=Manrope:wght@400;600&display=swap">
  <!-- Self-contained on purpose: GitHub Pages serves this file for any missing
       path, so relative links to assets/ would break on nested URLs. -->
  <style>
    :root { --gold: #c9a45c; --gold-light: #e8cf98; --sand: #efe4cf; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: radial-gradient(ellipse at 50% 110%, #3a2a14 0%, #101c33 45%, #0b0a08 80%);
      color: var(--sand);
      font-family: Manrope, system-ui, sans-serif;
      text-align: center;
    }
    svg { display: block; width: 220px; height: 59px; margin: 0 auto 28px; color: var(--gold); }
    .code { margin: 0 0 10px; color: var(--gold); font-family: Cinzel, Georgia, serif; letter-spacing: .5em; }
    h1 { margin: 0 0 14px; font-family: Cinzel, Georgia, serif; font-weight: 500; font-size: clamp(2rem, 6vw, 3.4rem); }
    h1 em { color: var(--gold-light); font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 400; }
    p { margin: 0 0 32px; color: #cfc3aa; line-height: 1.7; }
    a {
      display: inline-block;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #e8cf98, #c9a45c 50%, #9c7a3c);
      color: #0b0a08;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .26em;
      text-decoration: none;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 240 64" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M106 24C80 12 40 10 4 18M106 28C80 20 45 20 12 26M106 32C82 27 52 28 24 34M106 36C85 33 62 35 40 41M106 40C88 39 72 42 58 47"/>
        <path d="M134 24c26-12 66-14 102-6M134 28c26-8 61-8 94-2M134 32c24-5 54-4 82 2M134 36c21-3 44-1 66 5M134 40c18-1 34 2 48 7"/>
      </g>
      <circle cx="120" cy="30" r="11" fill="currentColor"/>
    </svg>
    <p class="code">404</p>
    <h1>This chamber <em>is empty</em></h1>
    <p>The page you're looking for has been lost to the sands.<br>Let us guide you back to the palace.</p>
    <a id="home" href="/">Return to The Pharo</a>
  </main>
  <script>
    // Project sites live under /<repo>/ on github.io; custom domains live at /.
    if (location.hostname.endsWith('github.io')) {
      var repo = location.pathname.split('/')[1];
      if (repo) document.getElementById('home').href = '/' + repo + '/';
    }
  </script>
</body>
</html>
